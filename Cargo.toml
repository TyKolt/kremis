[workspace]
members = [
    "crates/kremis-core",
    "apps/kremis",
    "apps/kremis-mcp",
]
resolver = "3"

[workspace.package]
version = "0.21.3"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/TyKolt/kremis"
homepage = "https://github.com/TyKolt/kremis"
readme = "README.md"

# =============================================================================
# WORKSPACE LINTS (inherited by all crates)
# =============================================================================

[workspace.lints.rust]
dead_code = "deny"

[workspace.lints.clippy]
# Critical denials — inherited by ALL crates
float_arithmetic = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# Allowed across workspace for ergonomics
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
similar_names = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
if_not_else = "allow"
map_unwrap_or = "allow"
trivially_copy_pass_by_ref = "allow"
uninlined_format_args = "allow"
unnecessary_wraps = "allow"
unused_self = "allow"
redundant_closure_for_method_calls = "allow"
needless_pass_by_value = "allow"
format_push_string = "allow"
missing_fields_in_debug = "allow"

# =============================================================================
# RELEASE PROFILE
# =============================================================================
# Integer overflow aborts in debug and wraps silently in release, which makes
# the same source produce two different arithmetics depending on how it was
# compiled. For an engine whose first law is determinism that is not a
# trade-off, so release keeps the checks.
[profile.release]
overflow-checks = true

# Benchmarks are excluded: their numbers are published, and adding a per-op
# check would shift them without a single line of logic having changed.
[profile.bench]
overflow-checks = false

# =============================================================================
# DISTRIBUTION PROFILE
# =============================================================================
# Used by the Dockerfile and by release.yml — never by CI's `build` job, which
# only needs to know whether the workspace compiles and throws the artifact away.
# Keeping the cost here means slower builds are paid a few times a year on the
# artifacts that ship, and never on every push across three operating systems.
[profile.release-dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"

[workspace.dependencies]
# =============================================================================
# CORE DEPENDENCIES (THE LOGIC - Pure Determinism)
# =============================================================================
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
redb = "4.1"
postcard = { version = "1.1", features = ["use-std"] }

# =============================================================================
# APP DEPENDENCIES (THE BINARY - Server + CLI)
# =============================================================================
clap = { version = "4.6", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
base64 = "0.23"
governor = "0.10"
subtle = "2.6"

toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }

# DEV / TESTS
proptest = "1.11"
tempfile = "3.27"
