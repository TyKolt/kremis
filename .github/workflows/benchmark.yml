name: Benchmark

on:
  push:
    branches: [main]

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  benchmark:
    name: Bench (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # rust-cache, not a hand-rolled actions/cache: the key here used to be
      # Cargo.lock alone, which does not change when `@stable` moves to a new
      # release. A benchmark run could then restore `target` built by the
      # previous compiler and publish those numbers to the README. rust-cache
      # folds the toolchain version into the key and drops the workspace
      # crates, so the benched binary is always rebuilt by the compiler that
      # this run actually resolved.
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench

      - name: Run benchmarks
        run: cargo bench -p kremis-core --bench graph_bench -- --output-format bencher | tee bench-output.txt

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.os }}
          path: bench-output.txt

  update-readme:
    name: Update README
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all benchmark results
        uses: actions/download-artifact@v8
        with:
          path: bench-results

      - name: Update README benchmarks
        run: |
          python3 << 'SCRIPT'
          import re, os, sys
          from datetime import datetime, timezone

          BENCHMARKS = [
              ("node_insertion/100000", "Node insertion (100K)"),
              ("signal_ingestion/sequence/10000", "Signal ingestion (10K batch)"),
              ("traverse/depth_50/1000", "Graph traversal (depth 50, 1K nodes)"),
              ("strongest_path/1000", "Strongest path (1K nodes)"),
              ("export_canonical/1000", "Canonical export (1K nodes)"),
              ("import_canonical/10000", "Canonical import (10K nodes)"),
              ("redb_operations/insert_nodes/1000", "Redb node insertion (1K)"),
          ]

          OS_LABELS = {
              "ubuntu-latest": "Linux",
              "windows-latest": "Windows",
              "macos-latest": "macOS",
          }

          OS_ORDER = ["ubuntu-latest", "windows-latest", "macos-latest"]

          # Unit is chosen from the value, then reused for its deviation: a band
          # rendered in a different unit than the figure it qualifies is worse
          # than no band at all.
          def unit_of(ns):
              if ns >= 1_000_000_000:
                  return 1_000_000_000, 1, "s"
              if ns >= 1_000_000:
                  return 1_000_000, 2, "ms"
              if ns >= 1_000:
                  return 1_000, 1, "\u00b5s"
              return 1, 0, "ns"

          def format_measure(ns, dev):
              div, prec, unit = unit_of(ns)
              out = f"{ns / div:.{prec}f} {unit}"
              # `is not None`, not truthiness: a deviation of 0 is REPORTED and
              # zero, which is the strongest thing the table can say about a
              # figure. Truthiness would render it identically to a deviation
              # that was never measured -- the same conflation this whole
              # change exists to remove.
              if dev is not None:
                  out += f" \u00b1{dev / div:.{prec}f}"
              return out

          # criterion's bencher format emits the deviation:
          #     test strongest_path/1000 ... bench:  11,790 ns/iter (+/- 1,918)
          # Until 2026-08-16 the pattern ended at "ns/iter" and that tail was
          # dropped, so the README published four significant figures for a
          # measurement whose own run reported +/- 16%. The uncertainty was
          # measured, carried all the way here, and discarded at the last step.
          # The group is optional: a missing deviation degrades to a bare value,
          # never to a crash.
          def parse_bench(path):
              results = {}
              with open(path) as f:
                  for line in f:
                      m = re.match(
                          r"test (.+?)\s+\.\.\. bench:\s+([\d,]+) ns/iter"
                          r"(?:\s+\(\+/-\s+([\d,]+)\))?",
                          line,
                      )
                      if m:
                          ns = int(m.group(2).replace(",", ""))
                          dev = int(m.group(3).replace(",", "")) if m.group(3) else None
                          results[m.group(1)] = (ns, dev)
              return results

          # Parse results per OS
          all_results = {}
          for os_name in OS_ORDER:
              path = os.path.join("bench-results", f"bench-{os_name}", "bench-output.txt")
              if os.path.exists(path):
                  all_results[os_name] = parse_bench(path)

          if not all_results:
              print("No benchmark results found", file=sys.stderr)
              sys.exit(1)

          date = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          os_present = [o for o in OS_ORDER if o in all_results]
          os_headers = " | ".join(OS_LABELS[o] for o in os_present)

          header = f"| Operation | {os_headers} |"
          separator = "|-----------|" + "|".join("------:" for _ in os_present) + "|"

          rows = []
          for name, display in BENCHMARKS:
              values = []
              has_any = False
              for o in os_present:
                  measure = all_results[o].get(name)
                  if measure is not None:
                      values.append(format_measure(*measure))
                      has_any = True
                  else:
                      values.append("\u2014")
              if has_any:
                  rows.append(f"| {display} | {' | '.join(values)} |")

          if not rows:
              print("No matching benchmark results found", file=sys.stderr)
              sys.exit(1)

          table = "\n".join([
              "## Benchmarks",
              "",
              f"> Auto-generated on CI runners \u2014 {date}.",
              "",
              header,
              separator,
          ] + rows + [
              "",
              "> The ± is criterion's deviation within a single run. Spread *between* runs",
              "> on hosted CI is wider still, because the runners themselves vary: figures",
              "> here have moved by tens of percent with no change to the benched code.",
              "> Read them as orders of magnitude, not as a regression signal.",
          ])

          section = f"<!-- BENCHMARK-START -->\n{table}\n<!-- BENCHMARK-END -->"

          with open("README.md") as f:
              readme = f.read()

          readme = re.sub(
              r"<!-- BENCHMARK-START -->.*?<!-- BENCHMARK-END -->",
              section,
              readme,
              flags=re.DOTALL,
          )

          with open("README.md", "w") as f:
              f.write(readme)

          print(f"Updated {len(rows)} benchmark entries across {len(os_present)} OS")
          SCRIPT

      - name: Commit README update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && echo "No changes" && exit 0
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "${GITHUB_SHA}" ]; then
            echo "main advanced since this run started; skipping stale README update"
            exit 0
          fi
          git commit -m "docs: update benchmark results [skip ci]"
          git push origin HEAD:main || {
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "${GITHUB_SHA}" ]; then
              echo "main advanced during push; skipping stale README update"
              exit 0
            fi
            exit 1
          }
